<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta property="og:title" content="You're invited to tend">
<meta property="og:description" content="Let's tend our camps together.">
<meta property="og:image" content="../img/bo.png">
<title>tend invite</title>
<style>
:root { --bg:#F1F4ED; --card:#FFF; --ink:#1D2A23; --muted:#5F6A63; --moss:#316849; --on-moss:#FFF; }
@media (prefers-color-scheme: dark) { :root { --bg:#121614; --card:#1C211E; --ink:#E7ECE8; --muted:#9BA79F; --moss:#6DBB92; --on-moss:#0E1A13; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:400 1.0625rem/1.5 system-ui, sans-serif; padding:16px; }
main { background:var(--card); border-radius:28px; padding:28px 22px; max-width:420px; width:100%; text-align:center; }
img { width:120px; height:auto; }
h1 { font-size:1.6rem; margin:8px 0; }
p { color:var(--muted); margin:8px 0; }
.code { font-size:2rem; letter-spacing:.3em; color:var(--moss); font-weight:700; margin:16px 0; }
a.btn { display:block; background:var(--moss); color:var(--on-moss); text-decoration:none; border-radius:999px; padding:14px; font-weight:700; margin-top:12px; }
a.alt { color:var(--moss); display:block; margin-top:12px; }
</style>
</head>
<body>
<main>
  <img src="../img/bo.png" alt="">
  <h1>Let's tend our camps together</h1>
  <p>A friend invited you to tend. Open it in the app to add each other.</p>
  <div class="code" id="code"></div>
  <a class="btn" id="open" href="../">Open in tend</a>
  <p>No tend yet? Get it, then in tend: Clearing → Friends → Enter a code.</p>
  <a class="alt" href="../">Get tend</a>
</main>
<script>
var c = (new URLSearchParams(location.search).get('c') || '').toUpperCase();
if (/^[A-Z2-9]{6}$/.test(c)) {
  document.getElementById('code').textContent = c.slice(0, 3) + ' ' + c.slice(3);
  var fallback = encodeURIComponent(location.origin + '/Bo-Mia/');
  document.getElementById('open').href = 'intent://invite?c=' + c + '#Intent;scheme=tend;package=app.tend;S.browser_fallback_url=' + fallback + ';end';
} else {
  document.getElementById('open').style.display = 'none';
}
</script>
</body>
</html>
