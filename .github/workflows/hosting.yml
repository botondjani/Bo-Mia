# Publishes docs/ (landing page, privacy, terms, invite page, app links) to https://tend.hu
# whenever main changes there, or by hand from the Actions tab.
# Needs one repository secret: FIREBASE_SERVICE_ACCOUNT_TEND_5244D (the JSON key of a service
# account with the "Firebase Hosting Admin" role in the tend-5244d project).
name: Deploy tend.hu
on:
  push:
    branches: [main]
    paths: [docs/**, firebase.json, .firebaserc]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEND_5244D }}
          projectId: tend-5244d
          channelId: live
